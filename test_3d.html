<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Test - CS2 Skin Creator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a2e;
            color: white;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 800px;
            height: 600px;
            background: #2a2a2a;
            margin: 20px auto;
            border: 2px solid #e94560;
        }
        .info {
            text-align: center;
            margin: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px;
            background: #16213e;
            border-radius: 5px;
        }
        .success { color: #4caf50; }
        .error { color: #e94560; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">🎮 3D Test - CS2 Skin Creator</h1>
    <div class="info">
        <div class="status" id="status">Ladataan...</div>
    </div>
    <div id="container"></div>
    
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        
        const statusEl = document.getElementById('status');
        
        try {
            statusEl.innerHTML = '✅ Three.js ladattu onnistuneesti!<br>Luodaan 3D-näkymä...';
            
            // Setup scene
            const container = document.getElementById('container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2a2a2a);
            
            // Camera
            const camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 0, 3);
            
            // Renderer
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            
            // Controls
            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            // Add a test cube with texture
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            // Draw test pattern
            const gradient = ctx.createLinearGradient(0, 0, 512, 512);
            gradient.addColorStop(0, '#ff0000');
            gradient.addColorStop(0.5, '#00ff00');
            gradient.addColorStop(1, '#0000ff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);
            
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('CS2 SKIN', 256, 200);
            ctx.fillText('CREATOR', 256, 280);
            ctx.fillText('WORKS!', 256, 360);
            
            const texture = new THREE.CanvasTexture(canvas);
            const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const material = new THREE.MeshStandardMaterial({ map: texture });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            
            // Grid
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);
            
            statusEl.innerHTML = `<span class="success">✅ 3D-näkymä toimii!</span><br>
                                  <span class="success">✅ OrbitControls ladattu</span><br>
                                  <span class="success">✅ Tekstuurit toimivat</span><br>
                                  <br>Pyöritä kuutiota hiirellä!`;
            
            // Load weapon test
            const loader = new OBJLoader();
            loader.load(
                'models/weapon_rif_ak47.obj',
                (obj) => {
                    obj.traverse((child) => {
                        if (child instanceof THREE.Mesh) {
                            child.material = material;
                        }
                    });
                    
                    // Position weapon next to cube
                    const box = new THREE.Box3().setFromObject(obj);
                    const center = box.getCenter(new THREE.Vector3());
                    obj.position.sub(center);
                    obj.position.x = 2.5;
                    
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    obj.scale.setScalar(1.5 / maxDim);
                    
                    scene.add(obj);
                    
                    statusEl.innerHTML += '<br><span class="success">✅ AK-47 malli ladattu!</span>';
                },
                (xhr) => {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    console.log(`Loading: ${percent}%`);
                },
                (error) => {
                    console.error('Error loading weapon:', error);
                    statusEl.innerHTML += '<br><span class="error">⚠️ Ase-mallin lataus epäonnistui (normaalia jos tiedostoa ei ole)</span>';
                }
            );
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                // Rotate cube
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                
                controls.update();
                renderer.render(scene, camera);
            }
            
            animate();
            
            // Handle resize
            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
            
        } catch (error) {
            statusEl.innerHTML = `<span class="error">❌ Virhe: ${error.message}</span>`;
            console.error(error);
        }
    </script>
</body>
</html>
